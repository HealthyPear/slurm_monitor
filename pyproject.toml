[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-monitoring"
version = "0.1.0"
description = "SLURM cluster statistics and core utilization monitoring tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SLURM Admin", email = "admin@example.com"}
]

dependencies = [
    "click>=8.1.0",          # CLI framework
    "pandas>=1.5.0",         # Data analysis
    "matplotlib>=3.7.0",     # Visualization
    "plotly>=5.0.0",         # Interactive plots
    "flask>=2.3.0",          # Web API
    "flask-cors>=4.0.0",     # CORS support
    "python-dateutil>=2.8.0", # Date utilities
    "pyyaml>=6.0",           # Configuration files
    "numpy>=1.20.0",         # Numerical computing
]

optional-dependencies = {
    dev = [
        "pytest>=7.0.0",
        "pytest-cov>=4.0.0",
        "black>=23.0.0",
        "ruff>=0.1.0",
        "mypy>=1.0.0",
    ],
    docs = [
        "sphinx>=5.0.0",
        "sphinx-rtd-theme>=1.0.0",
    ],
}

[project.scripts]
slurm-stats = "slurm_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
