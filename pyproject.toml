[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-monitoring"
version = "0.1.0"
description = "SLURM cluster statistics and core utilization monitoring tool"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SLURM Admin", email = "admin@example.com"}
]

dependencies = [
    "click>=8.1.7",          # CLI framework
    "pandas>=2.0.0",         # Data analysis
    "matplotlib>=3.8.0",     # Visualization
    "plotly>=5.24.0",        # Interactive plots
    "flask>=3.0.0",          # Web API
    "flask-cors>=4.0.0",     # CORS support
    "python-dateutil>=2.8.2", # Date utilities
    "pyyaml>=6.0",           # Configuration files
    "numpy>=1.24.0",         # Numerical computing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.scripts]
slurm-stats = "slurm_monitoring.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
