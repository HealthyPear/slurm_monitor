# SLURM Monitoring Configuration Example
#
# Copy this file to ~/.slurm_config.yaml and customize for your environment
# Or place it in any of these locations:
# - ./slurm_config.yaml (current directory)
# - ~/.slurm_config.yaml (home directory)
# - ~/.config/slurm_monitoring/config.yaml
# - /etc/slurm_monitoring/config.yaml
#
# For performance tuning guidance, see: docs/performance.rst

# SLURM general settings
slurm:
  command_timeout: 120  # Default timeout for SLURM commands (seconds)
  host: localhost       # SLURM cluster host (for remote monitoring)

# sacct command configuration
sacct:
  timeout: 120          # Timeout specifically for sacct command
  include_all_users: false  # Set to true to include all users (can be slow)
  include_steps: false  # Set to true to also count job steps (.batch, .extern, ...)
  format_fields:        # Fields to retrieve from sacct
    - JobID
    - JobName
    - User
    - Account
    - Start
    - End
    - CPUTime
    - AllocCPUS
    - State
    - ExitCode
  parsable: true        # Use parsable output format

# sinfo command configuration (cluster state)
sinfo:
  timeout: 30           # Timeout for sinfo command
  format_fields:        # Fields to retrieve from sinfo
    - NodeName
    - NodeAddr
    - State
    - CPUs
    - AllocCPUS
    - FreeCPUS

# squeue command configuration (running jobs)
squeue:
  timeout: 30           # Timeout for squeue command
  format_fields:        # Fields to retrieve from squeue
    - JobID
    - User
    - Name
    - State
    - CPUs
    - TimeLimit
    - StartTime

# sreport command configuration (cluster accounting reports)
sreport:
  timeout: 120          # Timeout for sreport command
  # Note: sreport queries SLURM's database, which may have retention limits
  # Typical retention: 3-30 days depending on cluster configuration

# seff command configuration (job efficiency metrics)
seff:
  timeout: 30           # Timeout for seff command per job
  # seff analyzes job efficiency for completed jobs
  # Useful for identifying resource waste

# Data collection settings
collection:
  default_lookback_days: 30  # Default number of days to analyze
  cache_dir: ~/.slurm-monitoring/cache  # Directory for caching data

# Dashboard server settings (used by `cli serve` / `pixi run dashboard-serve`)
dashboard:
  host: 127.0.0.1       # Bind address (use 0.0.0.0 to expose on the network)
  port: 8000            # Port; override with --port

# REST API settings
api:
  host: 0.0.0.0         # Listen on all interfaces
  port: 5000            # API port; override with --port
  debug: false          # Enable debug mode (false for production)

# Visualization settings
visualization:
  theme: seaborn        # Matplotlib theme
  output_format: html   # Output format (html, png, etc.)
