version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "latest"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      - pixi install --locked -e docs
    build:
      html:
        - pixi run --locked -e docs sphinx-build -T -W -b html docs $READTHEDOCS_OUTPUT/html
