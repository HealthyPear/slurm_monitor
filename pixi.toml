[workspace]
name = "slurm-monitoring"
version = "0.1.0"
description = "SLURM cluster statistics and core utilization monitoring tool"
authors = ["Michele Peresano <peresano.michele@gmail.com>"]
channels = ["conda-forge"]
# Older clusters (e.g. CentOS 7) ship glibc 2.17
platforms = [
    { name = "linux-64-glibc-2-17", platform = "linux-64", glibc = "2.17" },
    "osx-64",
    "osx-arm64",
]

[dependencies]
python = ">=3.11,<3.14"
click = ">=8.1.7"
pandas = ">=2.0.0"
matplotlib = ">=3.8.0"
plotly = ">=5.24.0"
numpy = ">=1.24.0"
pyyaml = ">=6.0"
python-dateutil = ">=2.8.2"

[pypi-dependencies]
slurm-monitoring = { path = ".", editable = true }
flask = ">=3.0.0"
flask-cors = ">=4.0.0"

[feature.dev.dependencies]
pytest = ">=8.1.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.14.0"
ruff = ">=0.5.0,<0.16"
mypy = ">=1.11.0"
pre-commit = ">=3.3.0"
ipython = ">=8.10.0"
jupyter = ">=1.0.0"

[feature.docs.dependencies]
sphinx = ">=8.0.0"
sphinx-rtd-theme = ">=2.0.0"
sphinx-design = "==0.7.0"
sphinx-autobuild = "*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
default = ["dev", "docs"]
docs = ["docs"]
py311 = ["dev", "py311"]
py312 = ["dev", "py312"]
py313 = ["dev", "py313"]

[tasks]
# Development tasks
test = "pytest tests/ -v --cov=src/slurm_monitoring --cov-report=term-missing --cov-report=xml"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
type-check = "mypy src/ --config-file=.mypy.ini"
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run --all-files"
quality = { depends-on = ["lint", "type-check"] }

# Documentation tasks
docs-build = "sphinx-build -b html docs docs/_build/html"
docs-clean = "rm -rf docs/_build/"
docs-serve = { cmd = "python -m http.server --directory docs/_build/html 8000", depends-on = [
    "docs-build",
] }
docs-watch = "sphinx-autobuild docs docs/_build/html --port 8000 --open-browser"
docs = { depends-on = ["docs-clean", "docs-build"] }

# Run CLI
cli = "python -m slurm_monitoring.cli"

# Start API server
api = "python -m slurm_monitoring.api.server"

# Generate and serve dashboard
dashboard-serve = { cmd = "python -m slurm_monitoring.cli dashboard --days 30 --output dashboard.html && python -m http.server 8000 --directory .", description = "Generate dashboard and serve on http://localhost:8000" }

# Generate comprehensive report with all plots
report-all = { cmd = "mkdir -p reports && python -m slurm_monitoring.cli dashboard --days 30 --output reports/dashboard.html && python -m slurm_monitoring.cli visualize --metric core-utilization --days 30 --output reports/core_usage.html && python -m slurm_monitoring.cli visualize --metric user-distribution --days 30 --output reports/users.html && python -m slurm_monitoring.cli visualize --metric peak-hours --days 30 --output reports/peak_times.html && python -m slurm_monitoring.cli stats --days 30 --format json --output reports/stats.json && python -m slurm_monitoring.cli users --days 30 --output reports/users.csv && echo 'Reports generated in reports/ directory'", description = "Generate complete monitoring report with all plots and stats" }

# Collect queue snapshot for history tracking
collect-snapshot = "python -m slurm_monitoring.cli collect-snapshot"

# Show queue trends from collected snapshots
trends = { cmd = "python -m slurm_monitoring.cli trends --hours 24", description = "Show queue trends from last 24 hours of collected snapshots" }

# Collect data
collect = "python -c \"from slurm_monitoring.collector import SlurmCollector; SlurmCollector().collect_all()\""

# Generate reports
report = "python -m slurm_monitoring.cli report"
