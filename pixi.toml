[workspace]
name = "slurm-monitoring"
version = "0.1.0"
description = "SLURM cluster statistics and core utilization monitoring tool"
authors = ["Michele Peresano <peresano.michele@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
click = ">=8.1.7"
pandas = ">=2.0.0"
matplotlib = ">=3.8.0"
plotly = ">=5.24.0"
numpy = ">=1.24.0"
pyyaml = ">=6.0"
python-dateutil = ">=2.8.2"

[pypi-dependencies]
slurm-monitoring = { path = ".", editable = true }
flask = ">=3.0.0"
flask-cors = ">=4.0.0"

[feature.dev.dependencies]
pytest = ">=8.1.0"
pytest-cov = ">=4.1.0"
black = ">=24.4.0"
ruff = ">=0.5.0"
mypy = ">=1.11.0"
pre-commit = ">=3.3.0"
ipython = ">=8.10.0"
jupyter = ">=1.0.0"
sphinx = ">=8.0.0"
sphinx-rtd-theme = ">=2.0.0"

[environments]
default = ["dev"]

[tasks]
# Development tasks
test = "pytest tests/ -v --cov=src/slurm_monitoring"
lint = "ruff check src/ tests/"
format = "black src/ tests/"
type-check = "mypy src/ --config-file=.mypy.ini"
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run --all-files"
quality = { depends-on = ["lint", "type-check"] }

# Documentation tasks
docs-build = "sphinx-build -b html docs docs/_build/html"
docs-clean = "rm -rf docs/_build/"
docs-serve = { cmd = "python -m http.server --directory docs/_build/html 8000", depends-on = [
    "docs-build",
] }
docs = { depends-on = ["docs-clean", "docs-build"] }

# Run CLI
cli = "python -m slurm_monitoring.cli"

# Start API server
api = "python -m slurm_monitoring.api.server"

# Generate and serve dashboard
dashboard-serve = { cmd = "python -m slurm_monitoring.cli dashboard --days 30 --output dashboard.html && python -m http.server 8000 --directory .", help = "Generate dashboard and serve on http://localhost:8000" }

# Collect data
collect = "python -c \"from slurm_monitoring.collector import SlurmCollector; SlurmCollector().collect_all()\""

# Generate reports
report = "python -m slurm_monitoring.cli report"
